[project]
name = "tw-stock-trade"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "psycopg[binary,pool]>=3.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "fastapi-users[sqlalchemy]>=13.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "arq>=0.28.0",
    "langchain>=1.3.1",
    "langgraph>=1.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langgraph-store-postgres>=0.1.0",
    "langchain-google-genai>=4.2.2",
    "langfuse>=4.6.1",
    "apscheduler>=3.10.0",
    "cryptography>=43.0.0",
    "aiohttp>=3.13.5",
    "python-dotenv>=1.0.0",
    "fubon-neo",
    "yfinance>=0.2.54",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv.sources]
fubon-neo = { path = "../fubon_neo-2.2.8-cp37-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl" }
